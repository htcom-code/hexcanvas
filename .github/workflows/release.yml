# Staging the five packages for release, triggered by a `v*` tag.
#
# A tag does not publish anything. It builds the release, proves it installs, and leaves
# it in npm's staging area for a person to approve — approval needs 2FA, so no workflow
# can do it. Until then nothing is installable.
#
# npm keeps a published version number forever, so the gates that answer "are these
# artifacts correct" all run before anything leaves the runner. Staging adds the one
# question they cannot answer — whether to release at all — and it is the only step that
# can be taken back: rejecting a stage deletes the record and frees the version number.
#
# `workflow_dispatch` with `dry_run` (the default) exercises the whole path without
# staging, which is the only way to find out whether this file works before a tag has
# already been pushed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check the tarballs without publishing"
        type: boolean
        default: true

# The default for every job. `stage` raises its own; nothing else needs more than
# reading the tree.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag has to agree with the manifests before anything is built: all five packages
  # move as one version (they depend on each other), so `v0.1.0` means five 0.1.0s.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: read the version from the tag
        id: version
        run: |
          # A dispatch has no tag, so it checks whatever the manifests currently say.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "releasing $version from tag $GITHUB_REF_NAME"
          else
            version=""
            echo "dispatch: checking the working manifests, whatever version they carry"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm check
      # The public surface still matches its committed report. A release is the one
      # moment this cannot be corrected afterwards: the API in a published version is
      # what that version has forever.
      - run: pnpm api
      # Packs all five and reads the tarballs back: the version gate, plus the mistakes
      # that are only visible inside the archive (a missing README, an unrewritten
      # `workspace:*`, a source map pointing at unpublished src).
      - run: node scripts/check-publish.mjs ${{ steps.version.outputs.version }}

  # The reference for this version, generated from the sources it was cut from.
  #
  # A tag is the only point where "the documentation for 0.2.0" means something exact,
  # so it is built here rather than being taken from whatever main looked like when the
  # site was last deployed. The documentation site reads this artifact; the API report
  # rides along so a consumer can diff two releases without a checkout.
  reference:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm api:docs
      - name: collect the reports beside it
        run: |
          mkdir -p api/reports
          cp packages/*/etc/*.api.md api/reports/
          ls -la api api/reports
      - uses: actions/upload-artifact@v7
        with:
          name: api-${{ needs.verify.outputs.version || 'dispatch' }}
          path: api/
          # Longer than CI's fortnight: this one is tied to a released version, and the
          # site may be rebuilt from it well after the tag.
          retention-days: 90

  # A renderer that only passes on a machine with no canvas has not passed. The tag
  # usually sits on a commit CI already ran, but "usually" is not a gate.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # See the same line in ci.yml: Firefox will not start as root while $HOME
      # belongs to pwuser, which is what a container job gets by default.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser

  # The same release, first, to a registry that is deleted when this job ends.
  #
  # `verify` reads the tarballs; this one installs them. Everything a resolver decides
  # lives here — whether the `exports` map hands a consumer the right file, whether the
  # four bindings find `@hexcanvas/core` from the registry rather than from a workspace
  # link that exists on no other machine, whether the published `.d.ts` survives a
  # consumer's `moduleResolution`, and whether a bundler can follow the import graph to
  # the end.
  #
  # It has to run before `publish` rather than after. A version number on npmjs.com can
  # never be reused, so a check that runs afterwards can report but cannot prevent; a
  # failure here costs nothing because nothing has left the runner.
  consumer:
    needs: verify
    runs-on: ubuntu-latest
    # Not a `services:` container. That starts before the checkout, so there is no way to
    # give it `config/verdaccio.yaml` — and the stock configuration proxies npmjs, which
    # made this job answer questions about the released copies instead of the build in
    # hand once the first version was out. `docker run` after the checkout can mount it.
    steps:
      - uses: actions/checkout@v7
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: start the throwaway registry
        run: |
          docker run -d --name registry -p 4873:4873 \
            -v "$PWD/config/verdaccio.yaml:/verdaccio/conf/config.yaml:ro" \
            verdaccio/verdaccio:6
      # The script waits for it to listen, and refuses to run if these packages are
      # already there — which is what a returning uplink would look like.
      - run: node scripts/verify-registry.mjs --registry http://localhost:4873
      - name: registry log on failure
        if: failure()
        run: docker logs registry

  # Uploads the release to npm's staging area. It is not installable until a human
  # approves it, and approval needs 2FA, which no workflow can supply.
  #
  # This is the one gate that survives the irreversible step. Everything before it proves
  # the artifacts are correct; this one asks whether to publish them at all — and a
  # rejected stage takes its version number with it, so answering "no" costs nothing.
  # Measured before being wired: `npm stage reject` deleted the record and the same
  # version staged again with a new id.
  #
  # Two things forced the switch away from `pnpm publish`, and staging happens to fix
  # both. pnpm never reads the `provenance` setting — it is in its rc option list but no
  # env form reaches it, and 0.1.0-next.0 went out with `dist.attestations: null` despite
  # NPM_CONFIG_PROVENANCE and a working id-token. And pnpm has no staging at all. `npm
  # stage publish` has a real `--provenance` flag and takes a tarball, which is what
  # keeps pnpm in the picture: `pnpm pack` is what rewrites `workspace:*`, and publishing
  # these through plain npm would ship the four bindings with a range no registry can
  # resolve.
  stage:
    needs: [verify, reference, browser, consumer]
    runs-on: ubuntu-latest
    permissions:
      # Provenance signs the build against this workflow run. Requested here rather than
      # at the top of the file so no other job carries it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      # Deliberately no `registry-url`. It writes an `.npmrc` containing
      # `_authToken=${NODE_AUTH_TOKEN}`, and npm treats a configured auth line as "I am
      # already authenticated" and never asks for an OIDC token — which is how a
      # workflow with trusted publishing configured ends up publishing with a secret, or
      # failing with E404 when there is no secret to expand.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      # Node 22 ships npm 10.9.8, which has no `stage` command at all. Pinned rather than
      # `@latest` so a release is not the first place a new npm runs.
      - run: npm install -g npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: pack
        # pnpm, never npm: `workspace:*` is rewritten as pnpm packs.
        #
        # `./packages/*` rather than `-r` or `--filter "@hexcanvas/*"`. `pack` has no
        # notion of `private: true` the way `publish` does, so `-r` also produces
        # tarballs for the root, the playground and the docs toolchain — and the name
        # filter catches `@hexcanvas/docs-tools`, which is how that package once had its
        # version bumped by a release command. The path is the only filter that means
        # exactly the five published packages.
        run: |
          mkdir -p tarballs
          pnpm --filter "./packages/*" pack --pack-destination "$PWD/tarballs"
          set -- tarballs/*.tgz
          printf '%s\n' "$@"
          test "$#" -eq 5
      - name: stage
        # No credential. `id-token: write` above lets npm exchange a GitHub OIDC token
        # for a short-lived one, against the trusted publisher configured on each of the
        # five packages (this repository, this workflow file, no environment). A secret
        # that does not exist cannot leak, expire, or be used from anywhere else.
        #
        # This could not be the first release: a trusted publisher can only be attached
        # to a package that already exists, so 0.1.0-next.0 went out with a token, which
        # was then revoked.
        run: |
          # A dispatch has no tag, so `verify` reports no version. Falling back to the
          # manifest keeps the dry run on the same branch the real release takes — the
          # first attempt at this took the empty string, skipped the prerelease branch,
          # and npm refused the publish. A dry run that does not follow the same path is
          # not telling you anything.
          version="${{ needs.verify.outputs.version }}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./packages/core/package.json').version")
            echo "no tag; taking $version from the manifest"
          fi
          # A prerelease must name a tag — npm refuses otherwise — and it must not be
          # `latest`, or `npm install @hexcanvas/core` starts resolving to it. A stable
          # release takes the default, which is how `latest` moves.
          case "$version" in
            *-*) tag=(--tag next) ;;
            *)   tag=() ;;
          esac
          dry=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry=(--dry-run)
          fi
          # `./` is load-bearing. npm reads a bare `tarballs/x.tgz` as the GitHub
          # shorthand `owner/repo` and refuses it: "Refusing to fetch
          # github:tarballs/hexcanvas-core-0.1.0-next.0.tgz". A leading `./` makes it a
          # path again.
          for tarball in ./tarballs/*.tgz; do
            npm stage publish "$tarball" --access public --provenance "${tag[@]}" "${dry[@]}"
          done
      - name: what to do next
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          # The job stops here on purpose. Approval waits on a person and 2FA, and a
          # runner held open for that is time spent for nothing.
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Staged, not published

          Nothing is installable yet. Check the artifacts, then approve or reject:

          ```sh
          npm stage list @hexcanvas/core     # and the other four
          npm stage download <stage-id>      # the tarball itself
          npm stage approve <stage-id>       # needs 2FA
          npm stage reject  <stage-id>       # frees the version number
          ```

          Approve `@hexcanvas/core` **last**: the four bindings depend on it by exact
          version, so a window where core is public and they are not is the harmless
          order, and the reverse breaks installs.
          SUMMARY
