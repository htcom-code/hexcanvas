<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexCanvas custom element</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e5e7eb; background: #090e19; }
      body { margin: 0; padding: 24px; display: grid; gap: 16px; grid-template-rows: auto 1fr auto; height: 100vh; box-sizing: border-box; }
      header { display: flex; gap: 16px; align-items: baseline; }
      header span { font-size: 20px; font-weight: 700; }
      header small, footer { color: #9ca3af; font-size: 13px; }
      /* Themed only through custom properties, and reaching into the shadow
         root with ::part() — no stylesheet from the library. */
      hexcanvas-editor {
        --hexcanvas-selection: #7c3aed;
        --hexcanvas-height: 60vh;
        border: 1px solid #1f2937;
        border-radius: 8px;
      }
      /* The find panel has a shadow root of its own and each row and field is a
         part of its own, forwarded past the editor's boundary with exportparts. */
      hexcanvas-editor::part(find-input) { border-color: #7c3aed; }
    </style>
  </head>
  <body>
    <header><span>HexCanvas</span><small>custom element, no framework — ⌘F find, ⌘H replace, ⌘G go to</small></header>
    <hexcanvas-editor id="editor" byte-group="4" search="native" decoration-labels="true" label-width="16"></hexcanvas-editor>
    <footer id="status">—</footer>
    <script type="module">
      import { MemoryByteSource } from "@hexcanvas/core";
      import "@hexcanvas/element";

      const text = new TextEncoder().encode("HexCanvas as a custom element.\nNo framework, no stylesheet import.\n");
      const bytes = new Uint8Array(4 * 1024);
      for (let index = 0; index < bytes.length; index++) bytes[index] = text[index % text.length];

      const editor = document.getElementById("editor");
      editor.source = new MemoryByteSource(bytes);
      editor.engine.setDecorations([
        // Labels are off by default; this demo turns them on with the attribute
        // above. `labelVisible` would show one range's label without that.
        { start: 0x00, end: 0x20, label: "header", color: "#6366f1", opacity: 0.25 },
        { start: 0x00, end: 0x0a, label: "magic", color: "#22c55e" },
      ], "structure");

      const status = document.getElementById("status");
      const render = () => {
        const state = editor.engine.getState();
        const fields = editor.engine.decorationsAt(state.cursor.offset, "structure").map((f) => f.label).join(" ▸ ");
        status.textContent = `0x${state.cursor.offset.toString(16).padStart(8, "0").toUpperCase()} · ${state.selection ? state.selection.end - state.selection.start : 0} selected · ${fields || "—"}`;
      };
      editor.engine.subscribe(render);
      editor.addEventListener("change", (event) => console.info("change", event.detail.changes.length));
      render();
    </script>
  </body>
</html>
